name: np-copilot-mcp

services:
  searxng:
    image: searxng/searxng:2026.8.22-9fea41204
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: "http://${SEARXNG_HOSTNAME:-localhost}:${SEARXNG_PORT:-8080}/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Initialize a private .env with Initialize-Environment.ps1}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mcp-network
    deploy:
      resources:
        limits:
          memory: 512m

  # This repository chooses a local stdio bridge, not upstream's optional HTTP
  # transport. Only SearXNG runs here; no remote browser-control service.

networks:
  mcp-network:
    driver: bridge
